services:
  tests:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    init: true
    environment:
      CI: "true"
      SAUCEDEMO_USERNAME: ${SAUCEDEMO_USERNAME}
      SAUCEDEMO_PASSWORD: ${SAUCEDEMO_PASSWORD}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["/bin/sh", "-c", "npm ci && npm run test:bdd"]
